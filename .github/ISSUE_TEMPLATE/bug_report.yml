name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Arqon version
      placeholder: "0.1.0"
    validations: {required: true}
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: links
    attributes:
      label: Your connections
      description: For example "Wi-Fi + Android phone over USB tethering". Do both have their own internet path?
  - type: textarea
    id: logs
    attributes:
      label: Problem report, logs or screenshots
      description: In Arqon, *Settings → Problem report → Copy report* and paste it here (it leaves out your user name and full addresses). The logs themselves are in `%APPDATA%\Arqon`.
