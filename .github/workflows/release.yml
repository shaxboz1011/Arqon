name: release

# Push a tag such as v0.1.0 and this builds, tests and publishes Arqon.exe with its SHA-256 as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Build the single-file Arqon.exe
        shell: pwsh
        run: ./tools/build.ps1 -Output out
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/Arqon.exe out/Arqon.exe.sha256 `
            --title "Arqon ${{ github.ref_name }}" --generate-notes --prerelease
