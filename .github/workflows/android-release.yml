name: android-release

# Push a tag such as android-v0.2.0 and this builds, tests and publishes the signed Arqon.apk as a (pre-)release.
# It needs the signing key in the repository secrets: see "Releasing" in android/README.md.
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests of the Kotlin core
        run: ./gradlew :core:test --console=plain
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARQON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The secret ARQON_KEYSTORE_BASE64 is missing: an APK signed with a throw-away key could not be updated by users later."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arqon.jks"
          echo "ARQON_KEYSTORE=$RUNNER_TEMP/arqon.jks" >> "$GITHUB_ENV"
      - name: Signed APK
        env:
          ARQON_KEYSTORE_PASSWORD: ${{ secrets.ARQON_KEYSTORE_PASSWORD }}
          ARQON_KEY_ALIAS: ${{ secrets.ARQON_KEY_ALIAS }}
          ARQON_KEY_PASSWORD: ${{ secrets.ARQON_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Arqon.apk"
          (cd "$RUNNER_TEMP" && sha256sum Arqon.apk > Arqon.apk.sha256)
          gh release create "${{ github.ref_name }}" "$RUNNER_TEMP/Arqon.apk" "$RUNNER_TEMP/Arqon.apk.sha256" \
            --title "Arqon for Android ${{ github.ref_name }}" --prerelease --generate-notes
